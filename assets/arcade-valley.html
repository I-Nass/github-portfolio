<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Arcade Alley</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', monospace;
      background: linear-gradient(rgba(0, 0, 0, 0.568)), url('https://i-nass.github.io/github-portfolio/assets/background-img.jpg') no-repeat center center/cover;
      color: #00ffee;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin: 30px 0;
      color: #ff00cc;
      text-shadow: 0 0 5px #ff00cc, 0 0 10px #ff00cc;
      text-align: center;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
      width: 90%;
      max-width: 1000px;
    }

    .game-tile {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #00ffee;
      border-radius: 12px;
      padding: 30px 10px;
      text-align: center;
      cursor: pointer;
      color: #fff;
      text-shadow: 0 0 2px #00ffee;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .game-tile:hover {
      background: rgba(0, 255, 204, 0.1);
      transform: scale(1.05);
    }

    #game-area {
      margin-top: 30px;
      width: 90%;
      max-width: 800px;
      /* Increased from 600px */
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #ff00cc;
      border-radius: 10px;
      padding: 20px;
      color: #fff;
      display: none;
    }

    #scoreboard {
      margin-top: 30px;
      width: 90%;
      max-width: 600px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #00ffee;
      border-radius: 10px;
      padding: 10px;
    }

    #scoreboard h2 {
      font-size: 14px;
      color: #00ffee;
      margin-bottom: 10px;
    }

    ul {
      list-style: none;
      padding: 0;
      font-size: 12px;
    }

    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .popup {
      background: #111;
      border: 2px solid #00ffee;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: 300px;
    }

    .popup h3 {
      color: #00ffee;
      margin-bottom: 15px;
    }

    .popup input {
      width: 100%;
      padding: 10px;
      border: 1px solid #00ffee;
      border-radius: 5px;
      margin-bottom: 10px;
      font-family: 'Press Start 2P', monospace;
    }

    .popup button {
      background: #00ffee;
      border: none;
      padding: 10px 20px;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
    }

    .popup button:hover {
      background: #00ccaa;
    }
  </style>
</head>

<body>
  <h1>🎮 Arcade Alley 🎮</h1>
  <div class="game-grid" id="game-selection">
    <div class="game-tile" data-game="Snake">🐍 Snake</div>
    <div class="game-tile" data-game="Tetris">🧱 Tetris</div>
    <div class="game-tile" data-game="Flappy">🐤 Flappy</div>
    <div class="game-tile" data-game="Memory">🧠 Memory</div>
    <div class="game-tile" data-game="Runner">🦖 Runner</div>
    <div class="game-tile" data-game="TicTacToe">⭕❌ Tic-Tac-Toe</div>
    <div class="game-tile" data-game="Whack">🔨 Whack-a-Mole</div>
    <div class="game-tile" data-game="Pong">🏓 Pong</div>
    <div class="game-tile" data-game="2048">🔢 2048</div>
  </div>
  <div id="game-area">
    <h2 id="game-title">Game Area</h2>
    <div id="game-container"></div>
    <button onclick="endGame()">End Game</button>
  </div>
  <div id="scoreboard">
    <h2>🏆 High Scores</h2>
    <ul id="score-list"></ul>
  </div>
  <div class="popup-overlay" id="namePopup">
    <div class="popup">
      <h3>Enter your name</h3>
      <input type="text" id="playerNameInput" placeholder="e.g. BoogieMan">
      <button onclick="startGame()">Play</button>
    </div>
  </div>
  <script>
    let currentGame = '';
    let currentPlayer = '';
    const gameArea = document.getElementById('game-area');
    const gameTitle = document.getElementById('game-title');
    const namePopup = document.getElementById('namePopup');

    // ─── G-01: Central cleanup registry ───────────────────────────────────────
    const activeHandles = {
      intervals: [],
      rafs: [],
      keyHandler: null
    };

    function stopActiveGame() {
      activeHandles.intervals.forEach(id => clearInterval(id));
      activeHandles.rafs.forEach(id => cancelAnimationFrame(id));
      activeHandles.intervals = [];
      activeHandles.rafs = [];
      // G-04: remove named Snake listener if present
      if (activeHandles.keyHandler) {
        document.removeEventListener('keydown', activeHandles.keyHandler);
        activeHandles.keyHandler = null;
      }
      // Clear any generic onkey/onmouse handlers set by other games
      document.onkeydown = null;
      document.onkeyup = null;
      document.onmousemove = null;
    }
    // ──────────────────────────────────────────────────────────────────────────

    // Game selection logic
    document.querySelectorAll('.game-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        currentGame = tile.dataset.game;
        namePopup.style.display = 'flex';
      });
    });

    function startGame() {
      currentPlayer = document.getElementById('playerNameInput').value.trim();
      if (!currentPlayer) {
        alert('Please enter your name!');
        return;
      }

      // G-01: stop any running game before starting a new one
      stopActiveGame();

      namePopup.style.display = 'none';
      gameArea.style.display = 'block';

      const container = document.getElementById('game-container');
      container.innerHTML = '';

      switch (currentGame) {
        case 'Snake':
          container.innerHTML = '<canvas id="snakeCanvas" width="400" height="400" style="background:black; display:block; margin:auto;"></canvas>';
          initSnakeGame();
          break;
        case 'Tetris':
          container.innerHTML = '<canvas id="tetrisCanvas" width="300" height="600" style="background:black; display:block; margin:auto;"></canvas>';
          initTetris();
          break;
        case 'Flappy':
          container.innerHTML = '<canvas id="flappyCanvas" width="400" height="400" style="background:skyblue; display:block; margin:auto;"></canvas>';
          initFlappy();
          break;
        case 'Memory':
          container.innerHTML = '<div id="memoryGame" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 300px; margin: auto;"></div>';
          initMemoryGame();
          break;
        case 'Runner':
          container.innerHTML = '<canvas id="runnerCanvas" width="600" height="200" style="background:white; display:block; margin:auto;"></canvas>';
          initRunner();
          break;
        case 'TicTacToe':
          container.innerHTML = '<div id="ticTacToeBoard" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: auto;"></div>';
          initTicTacToe();
          break;
        case 'Whack':
          container.innerHTML = '<div id="whackBoard" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: auto;"></div>';
          initWhack();
          break;
        case 'Pong':
          container.innerHTML = '<canvas id="pongCanvas" width="400" height="300" style="background:#111; display:block; margin:auto;"></canvas>';
          initPong();
          break;
        case '2048':
          container.innerHTML = '<div id="game2048" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 300px; margin: auto;"></div>';
          init2048();
          break;
      }

      gameTitle.textContent = `${currentGame} - Now Playing as ${currentPlayer}`;
    }

    // G-03: endGame called by the manual "End Game" button — no score argument,
    //       so we only clean up loops and hide the area, never write undefined to Firebase.
    function endGame() {
      stopActiveGame();
      gameArea.style.display = 'none';
    }

    function updateScores() {
      const scoreList = document.getElementById('score-list');
      scoreList.innerHTML = '';
    }

    // ─── SNAKE ────────────────────────────────────────────────────────────────
    let snake, food, dx, dy;

    function initSnakeGame() {
      const canvas = document.getElementById('snakeCanvas');
      const ctx = canvas.getContext('2d');
      const box = 20;
      let score = 0;

      snake = [{ x: 5 * box, y: 5 * box }];
      food = {
        x: Math.floor(Math.random() * 19 + 1) * box,
        y: Math.floor(Math.random() * 19 + 1) * box
      };
      dx = 0;
      dy = 0;

      // G-02: preventDefault stops page scrolling on arrow keys
      // G-04: named function stored in registry so it can be removed on cleanup
      function direction(event) {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) {
          event.preventDefault();
        }
        if (event.key === 'ArrowLeft' && (dx === 0 || snake.length === 1)) { dx = -box; dy = 0; }
        else if (event.key === 'ArrowUp' && (dy === 0 || snake.length === 1)) { dx = 0; dy = -box; }
        else if (event.key === 'ArrowRight' && (dx === 0 || snake.length === 1)) { dx = box; dy = 0; }
        else if (event.key === 'ArrowDown' && (dy === 0 || snake.length === 1)) { dx = 0; dy = box; }
      }

      // G-04: register handler so stopActiveGame() can remove it
      activeHandles.keyHandler = direction;
      document.addEventListener('keydown', direction);

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < snake.length; i++) {
          ctx.fillStyle = i === 0 ? 'lime' : 'lightgreen';
          ctx.fillRect(snake[i].x, snake[i].y, box, box);
        }

        ctx.fillStyle = 'red';
        ctx.fillRect(food.x, food.y, box, box);

        // S-01: live score HUD
        ctx.fillStyle = 'white';
        ctx.font = '14px monospace';
        ctx.fillText('Score: ' + score, 8, 18);

        // Waiting state: don't move or crash until player presses an arrow key
        if (dx === 0 && dy === 0) {
          ctx.save();
          ctx.fillStyle = '#00ffee';
          ctx.font = '12px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('PRESS ANY ARROW TO START', canvas.width / 2, canvas.height / 2);
          ctx.restore();
          return;
        }

        let head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height ||
          snake.some(seg => seg.x === head.x && seg.y === head.y)) {
          // G-01: use registry to stop the interval
          activeHandles.intervals.forEach(id => clearInterval(id));
          activeHandles.intervals = [];
          alert(`${currentPlayer}, your score for Snake is ${score}`);
          saveScore(currentPlayer, score);
          loadScores();
          gameArea.style.display = 'none';
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score++;
          food = {
            x: Math.floor(Math.random() * 19 + 1) * box,
            y: Math.floor(Math.random() * 19 + 1) * box
          };
        } else {
          snake.pop();
        }
      }

      // G-01: register interval in registry
      activeHandles.intervals.push(setInterval(draw, 100));
    }

    // ─── TETRIS ───────────────────────────────────────────────────────────────
    function initTetris() {
      const canvas = document.getElementById('tetrisCanvas');
      const ctx = canvas.getContext('2d');
      const ROWS = 20, COLS = 10, BLOCK_SIZE = 30;
      const colors = ['cyan', 'blue', 'orange', 'yellow', 'green', 'purple', 'red'];
      let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      let score = 0;
      let piece, dropInterval;

      const pieces = [
        [[1, 1, 1, 1]], // I
        [[1, 1, 1], [0, 1, 0]], // T
        [[1, 1, 0], [0, 1, 1]], // Z
        [[0, 1, 1], [1, 1, 0]], // S
        [[1, 1], [1, 1]], // O
        [[1, 1, 1], [1, 0, 0]], // L
        [[1, 1, 1], [0, 0, 1]]  // J
      ];

      function drawCell(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
      }

      function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            if (board[r][c]) drawCell(c, r, colors[board[r][c] - 1]);
        drawPiece();
        // S-01 style: score HUD
        ctx.fillStyle = 'white';
        ctx.font = '14px monospace';
        ctx.fillText('Score: ' + score, 4, 14);
      }

      function drawPiece() {
        piece.shape.forEach((row, y) => {
          row.forEach((val, x) => {
            if (val) drawCell(piece.x + x, piece.y + y, colors[piece.color]);
          });
        });
      }

      function collide() {
        return piece.shape.some((row, y) =>
          row.some((val, x) =>
            val && (board[piece.y + y]?.[piece.x + x] || piece.x + x < 0 || piece.x + x >= COLS || piece.y + y >= ROWS)
          )
        );
      }

      function merge() {
        piece.shape.forEach((row, y) => {
          row.forEach((val, x) => {
            if (val) board[piece.y + y][piece.x + x] = piece.color + 1;
          });
        });
      }

      function newPiece() {
        const index = Math.floor(Math.random() * pieces.length);
        piece = { shape: pieces[index], color: index, x: 3, y: 0 };
        if (collide()) gameOver();
      }

      function drop() {
        piece.y++;
        if (collide()) {
          piece.y--;
          merge();
          clearRows();
          newPiece();
        }
        drawBoard();
      }

      // T-01: only score when rows are actually cleared, with standard Tetris points
      function clearRows() {
        const before = board.length;
        board = board.filter(row => row.some(c => !c));
        const cleared = ROWS - board.length;
        while (board.length < ROWS) board.unshift(Array(COLS).fill(0));
        const points = [0, 100, 300, 500, 800];
        score += points[Math.min(cleared, 4)];
      }

      function move(dir) {
        piece.x += dir;
        if (collide()) piece.x -= dir;
      }

      function rotate() {
        const shape = piece.shape.map((_, i) => piece.shape.map(row => row[i])).reverse();
        const oldShape = piece.shape;
        piece.shape = shape;
        if (collide()) piece.shape = oldShape;
      }

      function gameOver() {
        activeHandles.intervals.forEach(id => clearInterval(id));
        activeHandles.intervals = [];
        alert(`${currentPlayer}, your score for Tetris is ${score}`);
        saveScore(currentPlayer, score);
        loadScores();
        gameArea.style.display = 'none';
      }

      // T-02: drawBoard() called immediately after each input so there is no lag
      // G-02: preventDefault stops page scroll on arrow keys
      document.onkeydown = e => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
        if (e.key === 'ArrowLeft') { move(-1); drawBoard(); }
        else if (e.key === 'ArrowRight') { move(1); drawBoard(); }
        else if (e.key === 'ArrowDown') { drop(); }
        else if (e.key === 'ArrowUp') { rotate(); drawBoard(); }
      };

      newPiece();
      drawBoard();
      // G-01: register interval in registry
      activeHandles.intervals.push(setInterval(drop, 500));
    }

    // ─── FLAPPY BIRD ──────────────────────────────────────────────────────────
    function initFlappy() {
      const canvas = document.getElementById('flappyCanvas');
      const ctx = canvas.getContext('2d');

      const gravity = 0.6;
      const lift = -10;
      let bird = { x: 50, y: 150, velocity: 0, radius: 15 };
      let pipes = [];
      let frame = 0;
      let score = 0;
      let gameOverFlag = false;
      let started = false;

      function drawBird() {
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'yellow';
        ctx.fill();
      }

      function drawPipe(pipe) {
        ctx.fillStyle = 'green';
        ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, pipe.width, canvas.height - pipe.bottom);
      }

      function update() {
        if (gameOverFlag) return;

        // Waiting state: bird hovers gently until first flap
        if (!started) {
          bird.y = 150 + Math.sin(frame * 0.08) * 6;
          return;
        }

        bird.velocity += gravity;
        bird.y += bird.velocity;

        if (frame % 100 === 0) {
          let top = Math.random() * 150 + 50;
          let gap = 100;
          // F-01: add `scored` flag to each pipe object
          pipes.push({ x: canvas.width, width: 40, top: top, bottom: top + gap, scored: false });
        }

        pipes.forEach(pipe => {
          pipe.x -= 2;
          if (
            bird.x + bird.radius > pipe.x &&
            bird.x - bird.radius < pipe.x + pipe.width &&
            (bird.y - bird.radius < pipe.top || bird.y + bird.radius > pipe.bottom)
          ) {
            endFlappy();
          }
          // F-01: boundary-crossing check instead of strict equality
          if (!pipe.scored && pipe.x + pipe.width < bird.x) {
            score++;
            pipe.scored = true;
          }
        });

        pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);

        // Ceiling: clamp instead of lethal collision
        if (bird.y - bird.radius < 0) {
          bird.y = bird.radius;
          bird.velocity = 0;
        }

        // Floor: lethal
        if (bird.y + bird.radius > canvas.height) {
          endFlappy();
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBird();
        pipes.forEach(drawPipe);
        ctx.fillStyle = 'black';
        ctx.font = '16px monospace';
        ctx.fillText('Score: ' + score, 10, 20);

        // Waiting prompt
        if (!started) {
          ctx.save();
          ctx.fillStyle = '#ff00cc';
          ctx.font = 'bold 12px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('TAP OR PRESS SPACE TO FLAP', canvas.width / 2, canvas.height / 2 + 30);
          ctx.restore();
        }
      }

      function gameLoop() {
        if (gameOverFlag) return;
        update();
        draw();
        frame++;
        // G-01: register RAF in registry
        activeHandles.rafs.push(requestAnimationFrame(gameLoop));
      }

      function flap() {
        if (!gameOverFlag) {
          started = true;
          bird.velocity = lift;
        }
      }

      function endFlappy() {
        if (gameOverFlag) return;
        gameOverFlag = true;
        alert(`${currentPlayer}, your score for Flappy is ${score}`);
        saveScore(currentPlayer, score);
        loadScores();
        gameArea.style.display = 'none';
      }

      // G-02: preventDefault stops spacebar page scroll
      document.onkeydown = e => {
        if (e.key === ' ' || e.key === 'ArrowUp') {
          e.preventDefault();
          flap();
        }
      };

      // F-02: click and touch support for mouse/mobile users
      canvas.addEventListener('click', flap);
      canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });

      bird = { x: 50, y: 150, velocity: 0, radius: 15 };
      pipes = [];
      score = 0;
      frame = 0;
      gameOverFlag = false;
      gameLoop();
    }

    // ─── MEMORY ───────────────────────────────────────────────────────────────
    function initMemoryGame() {
      const symbols = ['🍕', '🎮', '🚀', '👾', '🎲', '⚡', '💎', '🔥'];
      const cards = [...symbols, ...symbols].sort(() => 0.5 - Math.random());
      const container = document.getElementById('memoryGame');

      let firstCard = null;
      let secondCard = null;
      let matches = 0;
      let lock = false;
      let attempts = 0;

      container.innerHTML = '';
      cards.forEach((symbol, index) => {
        const card = document.createElement('button');
        card.textContent = '?';
        card.dataset.symbol = symbol;
        card.dataset.index = index;
        card.style.width = '60px';
        card.style.height = '60px';
        card.style.fontSize = '24px';
        card.style.cursor = 'pointer';
        card.style.fontFamily = 'monospace';
        card.style.border = '2px solid #00ffee';
        card.style.borderRadius = '8px';
        card.style.background = '#111';
        card.style.color = '#00ffee';

        card.addEventListener('click', () => {
          if (lock || card.disabled || card === firstCard) return;
          card.textContent = symbol;

          if (!firstCard) {
            firstCard = card;
          } else {
            secondCard = card;
            lock = true;
            attempts++;

            if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
              firstCard.disabled = true;
              secondCard.disabled = true;
              firstCard = null;
              secondCard = null;
              matches++;
              lock = false;

              if (matches === symbols.length) {
                setTimeout(() => {
                  // M-01: derive numeric score from attempt count; fewer = better
                  const score = Math.max(0, 1000 - attempts * 50);
                  alert(`${currentPlayer}, you completed Memory in ${attempts} attempts! Score: ${score}`);
                  saveScore(currentPlayer, score);
                  loadScores();
                  gameArea.style.display = 'none';
                }, 300);
              }
            } else {
              setTimeout(() => {
                firstCard.textContent = '?';
                secondCard.textContent = '?';
                firstCard = null;
                secondCard = null;
                lock = false;
              }, 800);
            }
          }
        });

        container.appendChild(card);
      });
    }

    // ─── RUNNER ───────────────────────────────────────────────────────────────
    function initRunner() {
      const canvas = document.getElementById('runnerCanvas');
      const ctx = canvas.getContext('2d');

      const dino = { x: 50, y: 160, w: 40, h: 40, vy: 0, gravity: 1, jumpPower: 20, onGround: true };
      const obstacles = [];
      let frame = 0;
      let score = 0;
      let running = true;

      function drawDino() {
        ctx.fillStyle = 'black';
        ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
      }

      function drawObstacles() {
        ctx.fillStyle = 'red';
        obstacles.forEach(ob => { ctx.fillRect(ob.x, ob.y, ob.w, ob.h); });
      }

      function update() {
        if (!running) return;

        dino.y += dino.vy;
        dino.vy += dino.gravity;
        if (dino.y >= 160) { dino.y = 160; dino.vy = 0; dino.onGround = true; }

        // R-01: speed and spawn rate scale with score
        const speed = 5 + Math.floor(score / 200);
        const spawnRate = Math.max(60, 120 - Math.floor(score / 300));
        // Give ~2 seconds (100 frames) clear runway before first obstacle spawns
        if (frame > 100 && frame % spawnRate === 0) {
          obstacles.push({ x: 600, y: 160, w: 20, h: 40 });
        }

        for (let ob of obstacles) {
          ob.x -= speed;
          if (dino.x < ob.x + ob.w && dino.x + dino.w > ob.x &&
            dino.y < ob.y + ob.h && dino.y + dino.h > ob.y) {
            running = false;
            endRunner();
            return;
          }
        }

        while (obstacles.length && obstacles[0].x + obstacles[0].w < 0) obstacles.shift();
        score++;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawDino();
        drawObstacles();
        ctx.fillStyle = 'black';
        ctx.font = '16px monospace';
        ctx.fillText('Score: ' + score, 10, 20);
      }

      function loop() {
        update();
        draw();
        frame++;
        if (running) {
          // G-01: register each RAF
          activeHandles.rafs.push(requestAnimationFrame(loop));
        }
      }

      function jump() {
        if (dino.onGround) { dino.vy = -dino.jumpPower; dino.onGround = false; }
      }

      function endRunner() {
        alert(`${currentPlayer}, your Runner score is ${score}`);
        saveScore(currentPlayer, score);
        loadScores();
        gameArea.style.display = 'none';
      }

      // G-02: preventDefault stops spacebar page scroll
      document.onkeydown = e => {
        if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); jump(); }
      };

      // F-02 style: tap-to-jump for mobile
      canvas.addEventListener('click', jump);
      canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });

      obstacles.length = 0; frame = 0; score = 0;
      dino.y = 160; dino.vy = 0; running = true;
      loop();
    }

    // Tic Tac Toe Implementation
    function initTicTacToe() {
      const board = Array(9).fill(null);
      const container = document.getElementById('ticTacToeBoard');


      let currentPlayerSymbol = 'X';
      let gameEnded = false;

      container.innerHTML = '';

      board.forEach((_, i) => {
        const btn = document.createElement('button');
        btn.style.width = '80px';
        btn.style.height = '80px';
        btn.style.fontSize = '24px';
        btn.style.fontFamily = 'monospace';
        btn.style.cursor = 'pointer';
        btn.style.border = '2px solid #00ffee';
        btn.style.borderRadius = '8px';
        btn.style.background = '#111';
        btn.style.color = '#00ffee';
        btn.textContent = '';

        btn.addEventListener('click', () => {
          if (board[i] || gameEnded) return;

          board[i] = currentPlayerSymbol;
          btn.textContent = currentPlayerSymbol;

          const winner = checkWinner(board);

          if (winner) {
            alert(`${currentPlayer} wins!`);
            const score = 100;
            saveScore(currentPlayer, score);
            loadScores();
            gameArea.style.display = 'none';
            gameEnded = true;
          } else if (board.every(cell => cell)) {
            alert(`It's a draw!`);
            const score = 50;
            saveScore(currentPlayer, score);
            loadScores();
            gameArea.style.display = 'none';
            gameEnded = true;
          } else {
            currentPlayerSymbol = currentPlayerSymbol === 'X' ? 'O' : 'X';
          }
        });

        container.appendChild(btn);
      });

      function checkWinner(b) {
        const lines = [
          [0, 1, 2], [3, 4, 5], [6, 7, 8],  // rows
          [0, 3, 6], [1, 4, 7], [2, 5, 8],  // cols
          [0, 4, 8], [2, 4, 6]              // diagonals
        ];

        for (let line of lines) {
          const [a, b2, c] = line;
          if (b[a] && b[a] === b[b2] && b[a] === b[c]) {
            return b[a];
          }
        }

        return null;
      }


    }

    //Pong implementation
    function initPong() {
      const canvas = document.getElementById('pongCanvas');
      const ctx = canvas.getContext('2d');
      let paddleHeight = 50, paddleWidth = 10;
      let playerY = canvas.height / 2 - paddleHeight / 2;
      let aiY = playerY;
      let baseSpeed = 3;
      let ball = { x: canvas.width / 2, y: canvas.height / 2, r: 7, dx: baseSpeed, dy: baseSpeed };
      let score = 0;
      let volleys = 0;
      let playing = true;
      let aiTargetOffset = 0;
      let statusBanner = '';
      let bannerTimer = 0;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Paddles
        ctx.fillStyle = '#00ffee';
        ctx.fillRect(0, playerY, paddleWidth, paddleHeight);
        ctx.fillRect(canvas.width - paddleWidth, aiY, paddleWidth, paddleHeight);

        // Ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ff00cc';
        ctx.fill();

        // Score & Volley HUD
        ctx.font = '12px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('Score: ' + score, 10, 20);
        ctx.fillStyle = '#00ffee';
        ctx.fillText('Volleys: ' + volleys, canvas.width - 110, 20);

        // Milestone Status Banner
        if (bannerTimer > 0) {
          bannerTimer--;
          ctx.save();
          ctx.fillStyle = '#ff00cc';
          ctx.font = 'bold 12px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(statusBanner, canvas.width / 2, 40);
          ctx.restore();
        }
      }

      function update() {
        if (!playing) return;
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Bounce top/bottom
        if (ball.y <= 0 || ball.y >= canvas.height) ball.dy *= -1;

        // Bounce on player — only when ball moving left (toward player paddle)
        if (ball.dx < 0 && ball.x - ball.r <= paddleWidth && ball.y >= playerY && ball.y <= playerY + paddleHeight) {
          volleys++;
          score++;

          // Angle deflection based on paddle hit point
          let hitOffset = (ball.y - (playerY + paddleHeight / 2)) / (paddleHeight / 2);
          let currentSpeed = baseSpeed + Math.min(3, Math.floor(volleys / 15) * 0.25);
          ball.dx = currentSpeed;
          ball.dy = hitOffset * (currentSpeed * 0.8) + (ball.dy > 0 ? 0.5 : -0.5);
          ball.x = paddleWidth + ball.r; // push out to prevent clipping/double-bounce

          // AI Tracking Accuracy Strategy:
          // Phase 1 (0–99 volleys): Sharp & accurate tracking
          // Phase 2 (100–149 volleys): Fatigue sets in with probabilistic misjudgments
          // Phase 3 (150+ volleys): Heavy fatigue
          if (volleys < 100) {
            aiTargetOffset = (Math.random() - 0.5) * 6;
          } else if (volleys <= 150) {
            if (Math.random() < 0.45) {
              aiTargetOffset = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 25);
            } else {
              aiTargetOffset = (Math.random() - 0.5) * 10;
            }
          } else {
            if (Math.random() < 0.55) {
              aiTargetOffset = (Math.random() > 0.5 ? 1 : -1) * (30 + Math.random() * 30);
            } else {
              aiTargetOffset = (Math.random() - 0.5) * 15;
            }
          }

          // Milestone announcements
          if (volleys === 50) {
            statusBanner = '50 VOLLEYS! SPEED UP';
            bannerTimer = 90;
          } else if (volleys === 100) {
            statusBanner = '100 VOLLEYS! AI FATIGUE';
            bannerTimer = 120;
          } else if (volleys === 150) {
            statusBanner = '150 VOLLEYS! OVERDRIVE';
            bannerTimer = 120;
          }
        }

        // Bounce on AI — only when ball moving right
        if (ball.dx > 0 && ball.x + ball.r >= canvas.width - paddleWidth && ball.y >= aiY && ball.y <= aiY + paddleHeight) {
          ball.dx = -Math.abs(ball.dx);
          ball.x = canvas.width - paddleWidth - ball.r;
        }

        // AI Missed (Player scores on AI)
        if (ball.x > canvas.width) {
          const goalBonus = volleys < 100 ? 5 : 3;
          score += goalBonus;
          ball.x = canvas.width / 2;
          ball.y = canvas.height / 2;
          let serveSpeed = baseSpeed + Math.min(3, Math.floor(volleys / 15) * 0.25);
          ball.dx = -serveSpeed; // serve toward player
          ball.dy = (Math.random() > 0.5 ? 1 : -1) * 2;
          aiTargetOffset = 0;
        }

        // Player Missed (Game Over)
        if (ball.x < 0) {
          playing = false;
          alert(`${currentPlayer}, your Pong score is ${score} (${volleys} volleys)`);
          saveScore(currentPlayer, score);
          loadScores();
          gameArea.style.display = 'none';
        }

        // AI Movement: tracking responsiveness scales down as fatigue increases
        let aiLerp = 0.24;
        if (volleys >= 100 && volleys <= 150) {
          aiLerp = 0.15;
        } else if (volleys > 150) {
          aiLerp = 0.12;
        }

        let targetY = ball.y + aiTargetOffset;
        aiY += (targetY - (aiY + paddleHeight / 2)) * aiLerp;
        if (aiY < 0) aiY = 0;
        if (aiY + paddleHeight > canvas.height) aiY = canvas.height - paddleHeight;
      }

      let keysPressed = {};

      document.onmousemove = e => {
        const rect = canvas.getBoundingClientRect();
        playerY = e.clientY - rect.top - paddleHeight / 2;
        clampPlayer();
      };

      document.onkeydown = e => {
        if (['ArrowUp', 'ArrowDown', 'w', 's'].includes(e.key)) e.preventDefault();
        keysPressed[e.key] = true;
      };

      document.onkeyup = e => {
        keysPressed[e.key] = false;
      };

      function clampPlayer() {
        if (playerY < 0) playerY = 0;
        if (playerY + paddleHeight > canvas.height) playerY = canvas.height - paddleHeight;
      }

      function handleInput() {
        if (keysPressed['ArrowUp'] || keysPressed['w']) {
          playerY -= 5;
        }
        if (keysPressed['ArrowDown'] || keysPressed['s']) {
          playerY += 5;
        }
        clampPlayer();
      }

      function loop() {
        handleInput();
        draw();
        update();
        if (playing) activeHandles.rafs.push(requestAnimationFrame(loop));
      }

      loop();
    }

    //2048 implementation

    function init2048() {
      const board = Array(16).fill(0);
      const container = document.getElementById('game2048');
      let score = 0;

      function drawBoard() {
        container.innerHTML = '';
        board.forEach(val => {
          const cell = document.createElement('div');
          cell.textContent = val ? val : '';
          cell.style.width = '60px';
          cell.style.height = '60px';
          cell.style.fontSize = '18px';
          cell.style.fontFamily = 'monospace';
          cell.style.border = '2px solid #00ffee';
          cell.style.borderRadius = '5px';
          cell.style.background = '#111';
          cell.style.color = '#00ffee';
          cell.style.display = 'flex';
          cell.style.alignItems = 'center';
          cell.style.justifyContent = 'center';
          container.appendChild(cell);
        });
      }

      function addRandom() {
        let empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
        if (empty.length === 0) return;
        let index = empty[Math.floor(Math.random() * empty.length)];
        board[index] = Math.random() > 0.9 ? 4 : 2;
      }

      function slide(row) {
        let arr = row.filter(v => v);
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] === arr[i + 1]) {
            arr[i] *= 2;
            score += arr[i];
            arr[i + 1] = 0;
          }
        }
        return [...arr.filter(v => v), ...Array(4 - arr.filter(v => v).length).fill(0)];
      }

      function rotateLeft(b) {
        const result = [];
        for (let c = 0; c < 4; c++) {
          for (let r = 3; r >= 0; r--) {
            result.push(b[r * 4 + c]);
          }
        }
        return result;
      }

      function rotateRight(b) {
        const result = [];
        for (let c = 3; c >= 0; c--) {
          for (let r = 0; r < 4; r++) {
            result.push(b[r * 4 + c]);
          }
        }
        return result;
      }


      function setBoardFromRows(rows) {
        for (let i = 0; i < 4; i++) {
          for (let j = 0; j < 4; j++) {
            board[i * 4 + j] = rows[i][j];
          }
        }
      }

      function move(direction) {
        let moved = false;

        function slideRow(row) {
          let arr = row.filter(v => v);
          for (let i = 0; i < arr.length - 1; i++) {
            if (arr[i] === arr[i + 1]) {
              arr[i] *= 2;
              score += arr[i];
              arr[i + 1] = 0;
            }
          }
          arr = arr.filter(v => v);
          while (arr.length < 4) arr.push(0);
          return arr;
        }

        let oldBoard = board.slice();

        if (direction === 'left') {
          for (let r = 0; r < 4; r++) {
            let row = board.slice(r * 4, r * 4 + 4);
            let newRow = slideRow(row);
            board.splice(r * 4, 4, ...newRow);
          }
        } else if (direction === 'right') {
          for (let r = 0; r < 4; r++) {
            let row = board.slice(r * 4, r * 4 + 4).reverse();
            let newRow = slideRow(row).reverse();
            board.splice(r * 4, 4, ...newRow);
          }
        } else if (direction === 'up') {
          // X-01: direct column iteration — slide each column upward
          for (let c = 0; c < 4; c++) {
            let col = [board[c], board[4 + c], board[8 + c], board[12 + c]];
            let slid = slideRow(col);
            [board[c], board[4 + c], board[8 + c], board[12 + c]] = slid;
          }
        } else if (direction === 'down') {
          // X-01: direct column iteration — slide each column downward
          for (let c = 0; c < 4; c++) {
            let col = [board[12 + c], board[8 + c], board[4 + c], board[c]];
            let slid = slideRow(col);
            [board[12 + c], board[8 + c], board[4 + c], board[c]] = slid;
          }
        }

        if (board.toString() !== oldBoard.toString()) {
          addRandom();
          drawBoard();
          if (!board.includes(0) && !canMerge()) {
            alert(`${currentPlayer}, your 2048 score is ${score}`);
            saveScore(currentPlayer, score);
            loadScores();
            gameArea.style.display = 'none';
          }
        }
      }


      document.onkeydown = e => {
        if (e.key.includes('Arrow')) {
          e.preventDefault(); // G-02: prevent page scroll
          const dir = e.key.replace('Arrow', '').toLowerCase();
          move(dir);
          if (!board.includes(0) && !canMerge()) {
            alert(`${currentPlayer}, your 2048 score is ${score}`);
            saveScore(currentPlayer, score);
            loadScores();
            gameArea.style.display = 'none';
          }
        }
      };

      function canMerge() {
        for (let i = 0; i < 16; i++) {
          let row = Math.floor(i / 4), col = i % 4;
          let val = board[i];
          if (col < 3 && board[i + 1] === val) return true;
          if (row < 3 && board[i + 4] === val) return true;
        }
        return false;
      }

      addRandom();
      addRandom();
      drawBoard();
    }

        const scoreList = document.getElementById("score-list");
        scoreList.innerHTML = "";

        if (!snapshot.exists()) {
          scoreList.innerHTML = "<li>No scores yet</li>";
          return;
        }

        const grouped = {};

        snapshot.forEach(child => {
          const data = child.val();
          if (!data.game || typeof data.score !== "number") return;
          if (!grouped[data.game]) grouped[data.game] = [];
          grouped[data.game].push(data);
